<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Deep Parekh | Aalor Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="card-wrapper" id="cardWrapper">
            <div class="card" id="businessCard">
                <!-- Front Side -->
                <div class="card-face front">
                    <div class="brand-vertical">AALOR STUDIO</div>
                    <div class="front-content">
                        <div class="intro-text">Hello, I'm</div>
                        <h1 class="main-name">
                            Deep<br>
                            <span>Parekh</span>
                        </h1>
                        <div class="role-badge">Founder of Aalor Studio</div>
                    </div>
                    
                    <div class="personal-image-container">
                        <img src="assets/images/Deep.png" alt="Deep Parekh" class="personal-image">
                    </div>
                    
                    <div class="footer-hint">Tap to Discover</div>
                </div>

                <!-- Back Side -->
                <div class="card-face back">
                    <div class="back-top">
                        <div class="back-logo">AALOR</div>
                        <div class="back-details">
                            <h2 class="back-name-full">Deep Parekh</h2>
                            <p class="back-title-full">Founder & Creative Director</p>
                        </div>
                    </div>
                    
                    <div class="contact-list">
                        <a href="mailto:deep@aalorstudio.com" class="contact-btn">
                            <div class="contact-icon">✉</div>
                            <span>deep@aalorstudio.com</span>
                        </a>
                        <a href="tel:+1234567890" class="contact-btn">
                            <div class="contact-icon">📞</div>
                            <span>+1 234 567 890</span>
                        </a>
                        <a href="https://aalorstudio.com" class="contact-btn" target="_blank">
                            <div class="contact-icon">🌐</div>
                            <span>aalorstudio.com</span>
                        </a>
                    </div>

                    <div class="back-footer">
                        <div class="qr-section">
                            <img src="qrcode.png" alt="QR Code" class="qr-mini">
                        </div>
                        <div class="social-side">
                            <div class="social-tag">@deepparekh</div>
                            <div class="social-tag">@aalorstudio</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
