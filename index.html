<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Deep Parekh | Aalor Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Cinematic Preloader -->
    <div id="preloader" class="preloader">
        <img src="assets/logo/Aalor Logo.png" alt="Aalor Logo" class="preloader-logo">
    </div>

    <!-- Ambient Dynamic Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="app-container" id="appContainer">
        <div class="card-wrapper" id="cardWrapper">
            <div class="card" id="businessCard">
                <!-- Front Side -->
                <div class="card-face front">
                    <div class="glare front-glare"></div>
                    <img src="assets/logo/Aalor Logo.png" alt="Aalor Studio Logo" class="front-logo">
                    <div class="front-content">
                        <div class="intro-text">Hello, I'm</div>
                        <h1 class="main-name">
                            Deep<br>
                            <span>Parekh</span>
                        </h1>
                        <div class="role-badge">Founder of Aalor Studio</div>
                    </div>
                    
                    <div class="personal-image-container">
                        <img src="assets/images/Deep.png" alt="Deep Parekh" class="personal-image">
                    </div>
                    
                    <div class="footer-hint">Tap to Discover</div>
                </div>

                <!-- Back Side -->
                <div class="card-face back">
                    <div class="glare back-glare"></div>

                    <!-- Header: Logo + Name -->
                    <div class="back-header">
                        <img src="assets/logo/Aalor Logo.png" alt="Aalor Studio Logo" class="back-logo-img">
                        <div class="back-header-text">
                            <h2 class="back-name">Deep Parekh</h2>
                            <p class="back-title">Founder &amp; Creative Director</p>
                        </div>
                    </div>

                    <div class="back-divider"></div>

                    <!-- Contact Rows -->
                    <div class="contact-list">
                        <a href="mailto:official.deepparekh@gmail.com" class="contact-btn">
                            <div class="contact-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/></svg>
                            </div>
                            <span>official.deepparekh@gmail.com</span>
                        </a>
                        <a href="tel:+919727019097" class="contact-btn">
                            <div class="contact-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                            </div>
                            <span>+91 9727019097</span>
                        </a>
                        <a href="https://aalorstudio.pages.dev" class="contact-btn" target="_blank">
                            <div class="contact-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 1 0 20 14.5 14.5 0 0 1 0-20"/><path d="M2 12h20"/></svg>
                            </div>
                            <span>aalorstudio.pages.dev</span>
                        </a>
                    </div>

                    <!-- Social Footer -->
                    <div class="back-footer">
                        <div class="social-row">
                            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 1.366.062 2.633.333 3.608 1.308.975.975 1.246 2.242 1.308 3.608.058 1.265.069 1.645.069 4.849s-.012 3.584-.07 4.85c-.062 1.366-.333 2.633-1.308 3.608-.975.975-2.242 1.246-3.608 1.308-1.265.058-1.645.069-4.849.069s-3.584-.012-4.85-.07c-1.366-.062-2.633-.333-3.608-1.308-.975-.975-1.246-2.242-1.308-3.608C2.175 15.747 2.163 15.367 2.163 12s.012-3.584.07-4.85c.062-1.366.333-2.633 1.308-3.608.975-.975 2.242-1.246 3.608-1.308C8.416 2.175 8.796 2.163 12 2.163zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
                            <div class="social-handles">
                                <span>@aalor_studio</span>
                                <span>@deepparekh111</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
